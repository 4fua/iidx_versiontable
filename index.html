<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IIDX Score Manager</title>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <style>
        body { font-family: "Helvetica Neue", Arial, sans-serif; margin: 20px; background-color: #f9f9f9; }
        .container { max-width: 1200px; margin: 0 auto; background: #fff; padding: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        table { width: 100% !important; }
        
        /* Tier Decoration */
        .tier-badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 0.9em; display: inline-block; width: 60px; text-align: center; }
        .tier-sp { background-color: #ffcccc; color: #cc0000; border: 1px solid #cc0000; }
        .tier-s  { background-color: #ffe0cc; color: #cc5200; border: 1px solid #cc5200; }
        .tier-a  { background-color: #ffffcc; color: #aaaa00; border: 1px solid #aaaa00; }
        .tier-b  { background-color: #ccffcc; color: #008800; border: 1px solid #008800; }
        .tier-c  { background-color: #ccffff; color: #0000cc; border: 1px solid #0000cc; }
        .tier-d  { background-color: #e0ccff; color: #6600cc; border: 1px solid #6600cc; }
        .tier-f  { background-color: #eeeeee; color: #666666; border: 1px solid #666666; }
    </style>
</head>
<body>

<div class="container">
    <h2>IIDX Difficulty Table (Level 12)</h2>
    <table id="scoreTable" class="display compact" style="width:100%">
        <thead>
            <tr>
                <th>Ver</th>
                <th>Title</th>
                <th>Type</th>
                <th>Tier</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

<script>
    $(document).ready(function() {
        // 修正箇所: dataフォルダ内のファイルを指定
        fetch('data/master_data.json')
            .then(response => {
                if (!response.ok) {
                    throw new Error("HTTP Status: " + response.status);
                }
                return response.json();
            })
            .then(data => {
                // データ修正処理: エスケープ文字(\)の除去
                data.forEach(song => {
                    if (song.title) {
                        song.title = song.title.replace(/\\/g, '');
                    }
                });

                $('#scoreTable').DataTable({
                    data: data,
                    columns: [
                        { 
                            data: 'ver', 
                            title: 'Ver', 
                            width: '5%',
                            className: 'dt-center'
                        },
                        { 
                            data: 'title', 
                            title: 'Title',
                            width: '55%',
                            render: function(data, type, row) {
                                // LEGGENDARIAの場合、末尾に [L] を付与
                                if (row.type === 'LEGGENDARIA') {
                                    return data + ' [L]';
                                }
                                return data;
                            }
                        },
                        { 
                            data: 'type', 
                            title: 'Type',
                            width: '20%'
                        },
                        { 
                            data: 'tier', 
                            title: 'Tier',
                            width: '20%',
                            className: 'dt-center',
                            render: function(data) {
                                if (!data || data === '-') return '-';
                                let cls = 'tier-f';
                                const d = data.toUpperCase();
                                if (d.includes('S+')) cls = 'tier-sp';
                                else if (d.includes('S')) cls = 'tier-s';
                                else if (d.includes('A')) cls = 'tier-a';
                                else if (d.includes('B')) cls = 'tier-b';
                                else if (d.includes('C')) cls = 'tier-c';
                                else if (d.includes('D')) cls = 'tier-d';
                                return `<span class="tier-badge ${cls}">${data}</span>`;
                            }
                        }
                    ],
                    pageLength: 100,
                    order: [[3, 'asc'], [0, 'asc']],
                    language: {
                        url: "//cdn.datatables.net/plug-ins/1.13.6/i18n/ja.json"
                    }
                });
            })
            .catch(err => {
                console.error('JSON Load Error:', err);
                alert('データの読み込みに失敗しました。パス(data/master_data.json)を確認してください。');
            });
    });
</script>

</body>
</html>
