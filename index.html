<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IIDX ☆12 Tier Viewer</title>
    <style>
        /* --- デザイン設定 --- */
        :root {
            --bg-fc: #ffa500;     /* Orange */
            --bg-exh: #ffd700;    /* Gold */
            --bg-hard: #ff6347;   /* Red */
            --bg-clear: #87ceeb;  /* Blue */
            --bg-easy: #98fb98;   /* Green */
            --bg-assist: #ffc0cb; /* Pink */
            --bg-failed: #c0c0c0; /* Gray */
            --bg-noplay: #ffffff; /* White */
            --text-dark: #222;
            --header-height: 50px;
        }

        body { font-family: "Helvetica Neue", Arial, sans-serif; margin: 0; padding: 0; background: #f4f4f4; color: #333; -webkit-text-size-adjust: 100%; }
        .page { display: none; padding: 15px; max-width: 1200px; margin: 0 auto; padding-top: 10px; }
        .active { display: block; }

        /* 入力画面 */
        .input-container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; max-width: 600px; margin: 20px auto; }
        textarea { width: 100%; height: 120px; margin-top: 10px; padding: 10px; border: 1px solid #ccc; font-family: monospace; box-sizing: border-box; }
        .btn { background: #333; color: white; border: none; padding: 12px 24px; border-radius: 4px; cursor: pointer; margin-top: 15px; font-weight: bold; font-size: 16px; width: 100%; max-width: 300px; }
        .btn:hover { background: #555; }
        .file-input-wrapper { border: 2px dashed #ccc; padding: 20px; margin-bottom: 20px; background: #fafafa; border-radius: 8px; }

        /* コントロールバー */
        .controls { 
            background: white; 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
            border-bottom: 1px solid #ddd; 
            margin: -15px -15px 15px -15px;
        }
        
        .control-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 15px;
            height: var(--header-height);
            box-sizing: border-box;
            background: #fff;
        }

        .control-body {
            display: none;
            padding: 15px;
            background: #f9f9f9;
            border-top: 1px solid #eee;
            max-height: 70vh;
            overflow-y: auto;
        }
        .control-body.open { display: block; }

        .filter-section { margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .filter-section:last-child { border-bottom: none; margin-bottom: 0; }
        .filter-title { font-weight: bold; font-size: 14px; margin-bottom: 8px; display: block; }

        .filter-group { display: flex; flex-wrap: wrap; gap: 8px; font-size: 13px; }
        .checkbox-wrapper { 
            cursor: pointer; display: inline-flex; align-items: center; 
            background: #fff; padding: 6px 10px; border-radius: 20px; border: 1px solid #ccc;
            user-select: none; font-size: 13px;
        }
        .checkbox-wrapper:active { background: #eee; }
        .checkbox-wrapper input { margin-right: 6px; transform: scale(1.2); }
        
        .small-btn { padding: 6px 12px; cursor: pointer; background: #eee; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        .menu-btn { background: #333; color: white; border: none; font-weight: bold; }

        /* トグルスイッチ */
        .toggle-wrapper { display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 14px; font-weight: bold; padding: 5px 0; }
        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .3s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: #2196F3; }
        input:checked + .slider:before { transform: translateX(20px); }

        /* バージョン枠 */
        .ver-section { margin-bottom: 25px; border: 1px solid #ccc; background: white; border-radius: 6px; overflow: hidden; }
        .ver-header { background: #444; color: white; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; }
        .ver-title { font-weight: bold; font-size: 1em; }
        .status-badge { padding: 3px 6px; border-radius: 4px; font-weight: bold; color: #333; background: #eee; margin-left: 4px; font-size: 0.75em; white-space: nowrap; }

        /* グリッドレイアウト */
        .song-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); 
            gap: 1px; 
            background-color: #ccc; 
            border-top: 1px solid #ccc; 
        }

        /* 楽曲セル */
        .song-box { 
            padding: 6px; min-height: 50px; 
            display: flex; flex-direction: column; justify-content: space-between; 
            font-size: 11px; color: var(--text-dark); 
            background: white; 
        }
        .song-title { font-weight: bold; margin-bottom: 4px; line-height: 1.25; word-break: break-all; font-size: 11px; }
        
        /* ★修正: Tierラベルを見やすく調整 */
        .song-meta { display: flex; justify-content: space-between; align-items: flex-end; opacity: 1.0; margin-top: auto; }
        .tier-label { 
            font-size: 11px;          /* 文字サイズUP */
            font-weight: bold;        /* 太字 */
            color: #000;              /* 真っ黒 */
            border: 1px solid #666;   /* 枠線を濃く */
            padding: 2px 5px;         /* 余白調整 */
            border-radius: 4px; 
            background: #ffffff;      /* 完全な白背景 */
            white-space: nowrap;      /* 改行禁止 */
        }
        
        .mark-l { color: #d00; font-weight: bold; margin-left: 2px; } 
        .mark-h { color: #a67c00; font-weight: bold; margin-left: 2px; }

        /* ランプ色定義 */
        .lamp-FULLCOMBO_CLEAR { background-color: var(--bg-fc); }
        .lamp-EX_HARD_CLEAR   { background-color: var(--bg-exh); }
        .lamp-HARD_CLEAR      { background-color: var(--bg-hard); color: white; }
        .lamp-HARD_CLEAR .mark-l { color: #ffcccc; }
        .lamp-HARD_CLEAR .mark-h { color: #ffffcc; }
        .lamp-CLEAR           { background-color: var(--bg-clear); }
        .lamp-EASY_CLEAR      { background-color: var(--bg-easy); }
        .lamp-ASSIST_CLEAR    { background-color: var(--bg-assist); }
        .lamp-FAILED          { background-color: var(--bg-failed); color: white; }
        .lamp-NO_PLAY         { background-color: var(--bg-noplay); }

        .badge-fc { background: var(--bg-fc); }
        .badge-exh { background: var(--bg-exh); }
        .badge-hard { background: var(--bg-hard); color: white; }
        .badge-normal { background: var(--bg-clear); }
        .badge-easy { background: var(--bg-easy); }

        @media (max-width: 480px) {
            .input-container { padding: 15px; margin: 10px auto; }
            h1 { font-size: 1.5em; text-align: center; margin: 10px 0; }
        }
    </style>
</head>
<body>

    <div id="page-input" class="page active">
        <h1>IIDX ☆12 Tier Viewer</h1>
        <div class="input-container">
            <p style="font-size:14px; color:#666;">公式サイトのCSVを読み込んでTier表を作成します</p>
            <div class="file-input-wrapper">
                <h3>CSVファイルを選択</h3>
                <input type="file" id="csvFile" accept=".csv" style="max-width: 100%;">
            </div>
            <div style="margin: 15px 0;">- OR -</div>
            <textarea id="csvText" placeholder="ここにCSVの中身を貼り付け"></textarea>
            <button class="btn" onclick="processData()">読み込んで表示</button>
        </div>
    </div>

    <div id="page-main" class="page">
        <div class="controls">
            <div class="control-header">
                <button class="small-btn" onclick="location.reload()">← 戻る</button>
                <div style="font-weight:bold; font-size:14px;">表示設定</div>
                <button class="small-btn menu-btn" onclick="toggleMenu()" id="menu-btn">メニュー ▼</button>
            </div>

            <div id="control-body" class="control-body">
                
                <div class="filter-section">
                    <span class="filter-title">表示モード</span>
                    <div class="toggle-wrapper">
                        <span>楽曲初出</span>
                        <label class="switch">
                            <input type="checkbox" id="verToggle" onchange="updateDisplay()" checked>
                            <span class="slider"></span>
                        </label>
                        <span>譜面初出</span>
                    </div>
                </div>

                <div class="filter-section">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                        <span class="filter-title" style="margin:0;">Tier絞り込み</span>
                        <div>
                            <button class="small-btn" style="font-size:11px; padding:3px 8px;" onclick="toggleAllFilters(true)">全選択</button>
                            <button class="small-btn" style="font-size:11px; padding:3px 8px;" onclick="toggleAllFilters(false)">全解除</button>
                        </div>
                    </div>
                    <div id="tier-filters" class="filter-group"></div>
                </div>
                
                <div style="text-align:center; margin-top:10px;">
                    <button class="small-btn" style="width:100%; padding:10px;" onclick="toggleMenu()">閉じる</button>
                </div>
            </div>
        </div>

        <div id="table-container"></div>
    </div>

    <script>
        // 設定
        const MASTER_JSON_URL = './data/master_data.json';
        const VER_NAME = {
            1: "1st&substream", 2: "2nd style", 3: "3rd style", 4: "4th style", 5: "5th style",
            6: "6th style", 7: "7th style", 8: "8th style", 9: "9th style", 10: "10th style",
            11: "IIDX RED", 12: "HAPPY SKY", 13: "DistorteD", 14: "GOLD", 15: "DJ TROOPERS",
            16: "EMPRESS", 17: "SIRIUS", 18: "Resort Anthem", 19: "Lincle", 20: "tricoro",
            21: "SPADA", 22: "PENDUAL", 23: "copula", 24: "SINOBUZ", 25: "CANNON BALLERS",
            26: "Rootage", 27: "HEROIC VERSE", 28: "BISTROVER", 29: "CastHour", 30: "RESIDENT",
            31: "EPOLIS", 32: "Pinky Crush", 33: "Sparkle Shower"
        };
        const LAMP_PRIORITY = {
            "FULLCOMBO CLEAR": 7, "EX HARD CLEAR": 6, "HARD CLEAR": 5,
            "CLEAR": 4, "EASY CLEAR": 3, "ASSIST CLEAR": 2, "FAILED": 1, "NO PLAY": 0
        };
        const TIER_ORDER = [
            "地力S+", "個人差S+", "地力S", "個人差S", 
            "地力A+", "個人差A+", "地力A", "個人差A", 
            "地力B+", "個人差B+", "地力B", "個人差B", 
            "地力C", "個人差C", "地力D", "個人差D",
            "地力E", "個人差E", "地力F", "個人差F"
        ];

        let masterData = [];
        let userLamps = {}; 
        let songOriginVer = {}; 
        let availableTiers = new Set();

        function toggleMenu() {
            const body = document.getElementById('control-body');
            const btn = document.getElementById('menu-btn');
            body.classList.toggle('open');
            if(body.classList.contains('open')){
                btn.innerHTML = "閉じる ▲";
            } else {
                btn.innerHTML = "メニュー ▼";
            }
        }

        function getMatchingKey(title) {
            if (!title) return "";
            return title.replace(/[\\"]/g, '');
        }

        window.onload = async function() {
            try {
                const res = await fetch(MASTER_JSON_URL);
                if (!res.ok) throw new Error("JSON読み込み失敗: " + res.status);
                masterData = await res.json();
                
                masterData.forEach(d => {
                    if (d.tier && d.tier !== '-') availableTiers.add(d.tier);
                    const v = d.ver_song || d.ver || 99;
                    if (d.type === 'ANOTHER') {
                        songOriginVer[d.title] = v;
                    }
                });

                initFilters();
            } catch (e) {
                alert("初期化エラー: " + e + "\n./data/master_data.json の配置を確認してください。");
            }
        };

        function initFilters() {
            const container = document.getElementById('tier-filters');
            container.innerHTML = "";
            TIER_ORDER.forEach(tier => {
                if (availableTiers.has(tier)) {
                    createCheckbox(container, tier);
                    availableTiers.delete(tier);
                }
            });
            availableTiers.forEach(tier => {
                createCheckbox(container, tier);
            });
            const label = document.createElement('label');
            label.className = 'checkbox-wrapper';
            label.innerHTML = `<input type="checkbox" value="-" checked onchange="updateDisplay()"> その他`;
            container.appendChild(label);
        }

        function createCheckbox(container, val) {
            const label = document.createElement('label');
            label.className = 'checkbox-wrapper';
            label.innerHTML = `<input type="checkbox" value="${val}" checked onchange="updateDisplay()"> ${val}`;
            container.appendChild(label);
        }

        async function processData() {
            const fileInput = document.getElementById('csvFile');
            const textInput = document.getElementById('csvText');
            let content = "";

            if (fileInput.files.length > 0) {
                content = await readFile(fileInput.files[0]);
            } else if (textInput.value.trim()) {
                content = textInput.value;
            } else {
                alert("CSVファイルを選択するか、テキストエリアに貼り付けてください。");
                return;
            }

            try {
                parseUserCSV(content);
                document.getElementById('page-input').classList.remove('active');
                document.getElementById('page-main').classList.add('active');
                updateDisplay();
            } catch (e) {
                alert("CSV解析エラー: " + e);
            }
        }

        function readFile(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = e => resolve(e.target.result);
                reader.onerror = e => reject(e);
                reader.readAsText(file, "Shift_JIS");
            });
        }

        function parseUserCSV(text) {
            userLamps = {};
            const rows = text.split(/\r\n|\n/);
            let headerIdx = -1, colMap = {};

            for (let i = 0; i < rows.length; i++) {
                if (rows[i].includes("タイトル")) {
                    headerIdx = i;
                    rows[i].split(",").forEach((c, idx) => colMap[c.trim()] = idx);
                    break;
                }
            }
            if (headerIdx === -1) throw new Error("ヘッダー(タイトル列)が見つかりません");

            for (let i = headerIdx + 1; i < rows.length; i++) {
                const row = parseCSVLine(rows[i]);
                if (!row || row.length < 2) continue;
                
                const rawTitle = row[colMap["タイトル"]];
                if (rawTitle) {
                    const key = getMatchingKey(rawTitle);
                    userLamps[key] = {
                        ANOTHER: row[colMap["ANOTHER クリアタイプ"]] || "NO PLAY",
                        LEGGENDARIA: row[colMap["LEGGENDARIA クリアタイプ"]] || "NO PLAY",
                        HYPER: row[colMap["HYPER クリアタイプ"]] || "NO PLAY"
                    };
                }
            }
        }

        function parseCSVLine(line) {
            const res = [];
            let current = '', inQuote = false;
            for(let char of line) {
                if(char === '"') inQuote = !inQuote;
                else if(char === ',' && !inQuote) { res.push(current); current = ''; }
                else current += char;
            }
            res.push(current);
            return res;
        }

        function updateDisplay() {
            const activeFilters = new Set();
            document.querySelectorAll('#tier-filters input:checked').forEach(cb => activeFilters.add(cb.value));
            const showChartVer = document.getElementById('verToggle').checked;

            const container = document.getElementById('table-container');
            container.innerHTML = "";
            const verGroups = {};

            masterData.forEach(song => {
                const tier = song.tier || "-";
                if (!activeFilters.has(tier)) return;

                const key = getMatchingKey(song.title);
                let myLamp = "NO PLAY";

                if (userLamps[key]) {
                    if (song.type === "ANOTHER") myLamp = userLamps[key].ANOTHER;
                    else if (song.type === "LEGGENDARIA") myLamp = userLamps[key].LEGGENDARIA;
                    else if (song.type === "HYPER") myLamp = userLamps[key].HYPER;
                }

                let targetVer = 99;
                if (showChartVer) {
                    targetVer = song.ver_chart || song.ver || 99;
                } else {
                    if (song.type === 'LEGGENDARIA' && songOriginVer[song.title]) {
                        targetVer = songOriginVer[song.title];
                    } else {
                        targetVer = song.ver_song || song.ver || 99;
                    }
                }
                
                if (!verGroups[targetVer]) verGroups[targetVer] = [];
                verGroups[targetVer].push({ ...song, myLamp: myLamp });
            });

            Object.keys(verGroups).sort((a,b) => Number(a) - Number(b)).forEach(verId => {
                const songs = verGroups[verId];
                if (songs.length === 0) return;

                songs.sort((a, b) => {
                    let idxA = TIER_ORDER.indexOf(a.tier);
                    let idxB = TIER_ORDER.indexOf(b.tier);
                    if (idxA === -1) idxA = 999;
                    if (idxB === -1) idxB = 999;
                    if (idxA !== idxB) return idxA - idxB;
                    return a.title.localeCompare(b.title);
                });

                const section = document.createElement('div');
                section.className = 'ver-section';
                
                const badges = generateBadges(songs);
                const vName = VER_NAME[verId] || `Ver.${verId}`;

                section.innerHTML = `
                    <div class="ver-header">
                        <span class="ver-title">${vName}</span>
                        <div>${badges}</div>
                    </div>
                    <div class="song-grid"></div>
                `;
                
                const grid = section.querySelector('.song-grid');
                songs.forEach(s => {
                    const lampClean = s.myLamp.replace(/ /g, '_');
                    const displayTitle = s.title.replace(/\\/g, '');

                    let suffix = "";
                    if (s.type === 'LEGGENDARIA') suffix = ' <span class="mark-l">[L]</span>';
                    else if (s.type === 'HYPER') suffix = ' <span class="mark-h">H</span>';

                    const box = document.createElement('div');
                    box.className = `song-box lamp-${lampClean}`;
                    box.innerHTML = `
                        <div class="song-title">${displayTitle}${suffix}</div>
                        <div class="song-meta">
                            <span class="tier-label">${s.tier || "-"}</span>
                        </div>
                    `;
                    grid.appendChild(box);
                });
                container.appendChild(section);
            });
        }

        function generateBadges(songs) {
            let minP = 99;
            let hasSong = false;
            songs.forEach(s => {
                const p = LAMP_PRIORITY[s.myLamp] !== undefined ? LAMP_PRIORITY[s.myLamp] : 0;
                if (p < minP) minP = p;
                hasSong = true;
            });
            if (!hasSong) return "";

            let txt="", cls="";
            if(minP>=7){ txt="FC"; cls="badge-fc"; }
            else if(minP>=6){ txt="EXH"; cls="badge-exh"; }
            else if(minP>=5){ txt="HARD"; cls="badge-hard"; }
            else if(minP>=4){ txt="CLEAR"; cls="badge-normal"; }
            else if(minP>=3){ txt="EASY"; cls="badge-easy"; }
            else return "";

            return `<span class="status-badge ${cls}">${txt}</span>`;
        }

        function toggleAllFilters(enable) {
            document.querySelectorAll('#tier-filters input').forEach(cb => cb.checked = enable);
            updateDisplay();
        }
    </script>
</body>
</html>
